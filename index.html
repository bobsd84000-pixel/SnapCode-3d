<style>
:root{
--cobalt:oklch(0.52 0.26 268);--cobalt-fonce:oklch(0.44 0.23 268);--sur-cobalt:oklch(1 0 0);

--t-xs:.85rem;--t-s:.9rem;--t-m:.95rem;--t-base:16px;--t-h2:1.15rem;--t-h1:clamp(2.2rem,8vw,3.4rem);
--r-panneau:14px;--r-ctrl:10px;--r-zone:8px;--r-fin:4px;
--trait:1.5px;--coin:3px;
}
:root{color-scheme:dark;--fond:oklch(0.19 0.045 262);--carte:oklch(0.235 0.05 262);--champ:oklch(0.16 0.04 262);--encre:oklch(0.96 0.012 262);--encre-2:oklch(0.77 0.045 262);--ligne:oklch(0.38 0.07 262);--cobalt-trait:oklch(0.74 0.14 268);--erreur:oklch(0.79 0.13 25);--erreur-fond:oklch(0.29 0.07 25);}
html[data-theme="clair"]{color-scheme:light;--fond:oklch(0.95 0.022 262);--carte:oklch(0.995 0.004 262);--champ:oklch(1 0 0);--encre:oklch(0.22 0.06 262);--encre-2:oklch(0.45 0.07 262);--ligne:oklch(0.85 0.04 262);--cobalt-trait:oklch(0.52 0.26 268);--erreur:oklch(0.47 0.17 27);--erreur-fond:oklch(0.95 0.025 20);}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:var(--t-base)/1.5 var(--texte);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt-trait);outline-offset:2px}
p{text-wrap:pretty}
.page{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:8px 0 20px}
h1{font:400 var(--t-h1)/1.02 var(--titre);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}

.depot span{font-weight:500}
.depot small{display:block;color:var(--encre-2);margin-top:4px;font-size:var(--t-s)}

<body>
<div class="page">
<header>
<div>
<h1>Snapcode 3D</h1>
<p>Dépose une capture 3D (Armorpaint, Gods Eye View, etc.). Récupère du code Three.js prêt à déployer.</p>
</div>
<button type="button" class="bascule" id="themeToggle"></button>
</header>

<div class="grille">
<section class="panneau" aria-label="Réglages">
<h2>Capture 3D</h2>
<div class="depot" id="depot">
<input type="file" id="fichier" accept="image/png,image/jpeg,image/webp" aria-label="Choisir une capture 3D">
<div id="depotTexte"><span>Dépose une capture 3D</span><small>PNG, JPG ou WebP</small></div>
<img id="apercu" alt="Aperçu" hidden>
</div>

<div class="choix" role="group" aria-label="Format 3D">
<button type="button" data-format="threejs" aria-pressed="true">Three.js</button>
<button type="button" data-format="babylon" aria-pressed="false">Babylon.js</button>
<button type="button" data-format="playcanvas" aria-pressed="false">PlayCanvas</button>
</div>

<label class="cle" for="cle">Clé API Anthropic</label>
<input type="password" id="cle" autocomplete="off" placeholder="sk-ant-…">
<p class="aide">La clé reste local. Laisse vide si tu tournes dans Claude.</p>

<button type="button" class="primaire" id="generer" disabled>Générer le code 3D</button>
<div class="etat" id="etat" role="status" aria-live="polite" hidden></div>
<div class="erreur" id="erreur" role="alert" hidden></div>
</section>

<section class="panneau" aria-label="Résultat">
<h2>Code 3D</h2>
<div id="vide" class="vide">Le code 3D apparaîtra ici après la génération.</div>
<div id="resultat" hidden>
<p class="aide" id="etiquette" style="margin:0 0 10px"></p>
<div class="barre">
<button type="button" class="secondaire" id="copier">Copier</button>
<span class="espace"></span>
<button type="button" class="secondaire" id="telecharger">Télécharger</button>
</div>
<div class="cadre">
<iframe id="cadre" title="Aperçu 3D" sandbox="allow-scripts"></iframe>
</div>
</div>
</section>
</div>
</div>

<script type="text/plain" id="scene-bracelet">
/* Manchette en argent ciselée — Three.js r128 */
var W=innerWidth,H=innerHeight;
var r=new THREE.WebGLRenderer({antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W,H);
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);

var s=new THREE.Scene();s.background=new THREE.Color(0x0d1530);
var cam=new THREE.PerspectiveCamera(38,W/H,0.1,100);
cam.position.set(0,2.4,5.6);cam.lookAt(0,-0.35,0);

/* Environnement studio : reflets de l'argent */
var env=new THREE.Scene();
var cv=document.createElement("canvas");cv.width=16;cv.height=256;
var g=cv.getContext("2d"),gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,"#ffffff");gr.addColorStop(0.45,"#9aa3b8");gr.addColorStop(0.55,"#3a4258");gr.addColorStop(1,"#0e111a");
g.fillStyle=gr;g.fillRect(0,0,16,256);
env.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),side:THREE.BackSide})));
function softbox(x,y,z,w,h){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);env.add(m)}
softbox(5,5,3,4,2);softbox(-6,3,-2,3,3);softbox(0,-1,6,6,1);softbox(-3,6,5,2,2);
var pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(env,0.02).texture;

/* Gravure : texture dessinée (creux sombres = argent oxydé) */
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var T=document.createElement("canvas");T.width=2048;T.height=512;var t=T.getContext("2d");
t.fillStyle="#a4a4a4";t.fillRect(0,0,2048,512);
/* rangées de fils torsadés */
for(var y=64;y<448;y+=10){
  t.fillStyle="#5c5c5c";t.fillRect(0,y,2048,2);
  t.strokeStyle="rgba(255,255,255,.55)";t.lineWidth=2;
  for(var x=0;x<2048;x+=7){t.beginPath();t.moveTo(x,y+3);t.lineTo(x+5,y+9);t.stroke()}
}
/* perles le long des bords */
function perles(y){for(var x=4;x<2048;x+=14){t.fillStyle="#4a4a4a";t.beginPath();t.arc(x,y,6,0,7);t.fill();t.fillStyle="#e2e2e2";t.beginPath();t.arc(x-1,y-1,3.5,0,7);t.fill()}}
perles(44);perles(468);
/* plaques florales aux deux extrémités */
function fleur(cx,cy,R){
  for(var k=0;k<5;k++){var a=k*Math.PI*2/5-Math.PI/2;
    t.save();t.translate(cx+Math.cos(a)*R*0.62,cy+Math.sin(a)*R*0.62);t.rotate(a);
    t.fillStyle="#d8d8d8";t.strokeStyle="#333";t.lineWidth=3;
    t.beginPath();t.ellipse(0,0,R*0.55,R*0.36,0,0,7);t.fill();t.stroke();t.restore()}
  t.fillStyle="#3a3a3a";t.beginPath();t.arc(cx,cy,R*0.3,0,7);t.fill();
  t.fillStyle="#eee";t.beginPath();t.arc(cx-2,cy-2,R*0.16,0,7);t.fill();
}
function feuille(x1,y1,x2,y2,cx,cy){
  t.strokeStyle="#333";t.lineWidth=5;t.beginPath();t.moveTo(x1,y1);t.quadraticCurveTo(cx,cy,x2,y2);t.stroke();
  t.fillStyle="#cfcfcf";t.beginPath();t.moveTo(x1,y1);t.quadraticCurveTo(cx,cy,x2,y2);t.quadraticCurveTo((x1+x2)/2+(x1+x2)/2-cx,(y1+y2)/2+(y1+y2)/2-cy,x1,y1);t.fill();
}
function plaque(x0,w){
  var y0=58,h=396,c=34;
  t.fillStyle="#7a7a7a";
  t.beginPath();t.moveTo(x0+c,y0);t.lineTo(x0+w-c,y0);t.lineTo(x0+w,y0+c);t.lineTo(x0+w,y0+h-c);t.lineTo(x0+w-c,y0+h);t.lineTo(x0+c,y0+h);t.lineTo(x0,y0+h-c);t.lineTo(x0,y0+c);t.closePath();t.fill();
  t.strokeStyle="#2e2e2e";t.lineWidth=8;t.stroke();
  t.strokeStyle="#e6e6e6";t.lineWidth=3;t.stroke();
  /* fond martelé */
  for(var i=0;i<1400;i++){var px=x0+14+rnd()*(w-28),py=y0+14+rnd()*(h-28);t.fillStyle=rnd()>.5?"#555":"#9c9c9c";t.fillRect(px,py,3,3)}
  var mx=x0+w/2;
  feuille(mx,y0+h-40,mx-70,y0+200,mx-80,y0+320);
  feuille(mx,y0+h-40,mx+70,y0+150,mx+90,y0+300);
  feuille(mx-40,y0+120,mx-90,y0+60,mx-20,y0+60);
  fleur(mx,y0+h/2,62);fleur(mx-60,y0+95,34);fleur(mx+62,y0+h-95,38);
  t.fillStyle="#ddd";for(var b=0;b<6;b++){t.beginPath();t.arc(mx-80+rnd()*160,y0+30+rnd()*(h-60),9,0,7);t.fill()}
}
plaque(6,272);plaque(2048-278,272);

var tex=new THREE.CanvasTexture(T);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=r.capabilities.getMaxAnisotropy();
var bump=new THREE.CanvasTexture(T);
var grave=new THREE.MeshStandardMaterial({color:0xf2f2f5,metalness:1,roughness:0.34,map:tex,bumpMap:bump,bumpScale:0.025});
var lisse=new THREE.MeshStandardMaterial({color:0xe6e8ec,metalness:1,roughness:0.18,side:THREE.DoubleSide});

/* Forme : manchette ouverte, taille légèrement creusée */
var GAP=0.62,PH0=GAP/2,PHL=Math.PI*2-GAP,E=0.045,HH=0.62;
var pts=[];for(var j=0;j<=24;j++){var yy=-HH+2*HH*j/24,q=yy/HH;pts.push(new THREE.Vector2(1.42+0.16*q*q,yy))}
var inner=pts.map(function(p){return new THREE.Vector2(p.x-E,p.y)});
var grp=new THREE.Group();
var ext=new THREE.Mesh(new THREE.LatheGeometry(pts,160,PH0,PHL),grave);
var int_=new THREE.Mesh(new THREE.LatheGeometry(inner,160,PH0,PHL),lisse);
grp.add(ext,int_);
function bout(phi){
  var pos=[],idx=[];
  for(var j=0;j<pts.length;j++){var ro=pts[j].x,ri=ro-E,y=pts[j].y;
    pos.push(Math.sin(phi)*ro,y,Math.cos(phi)*ro,Math.sin(phi)*ri,y,Math.cos(phi)*ri);
    if(j){var a=(j-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
  var gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));gg.setIndex(idx);gg.computeVertexNormals();
  return new THREE.Mesh(gg,lisse);
}
grp.add(bout(PH0),bout(PH0+PHL));
/* Bourrelets polis haut et bas */
function jonc(y,rr){var c=[];for(var k=0;k<=14;k++){var a=k/14*Math.PI*2;c.push(new THREE.Vector2(rr-E/2+Math.cos(a)*0.035,y+Math.sin(a)*0.035))}return new THREE.Mesh(new THREE.LatheGeometry(c,160,PH0,PHL),lisse)}
grp.add(jonc(HH,pts[24].x),jonc(-HH,pts[0].x));
grp.traverse(function(o){if(o.isMesh)o.castShadow=true});

/* Pierre */
var pg=new THREE.IcosahedronGeometry(2.7,4),pa=pg.attributes.position;
for(var i=0;i<pa.count;i++){var vx=pa.getX(i),vy=pa.getY(i),vz=pa.getZ(i),f=1+0.07*Math.sin(3*vx+1)*Math.sin(2*vy+2)*Math.sin(4*vz)+0.03*Math.sin(9*vx+5*vz);pa.setXYZ(i,vx*f,vy*f,vz*f)}
pg.computeVertexNormals();
var pierre=new THREE.Mesh(pg,new THREE.MeshStandardMaterial({color:0x8d8f8a,roughness:0.95,metalness:0,flatShading:true}));
pierre.scale.set(1,0.42,0.9);pierre.position.y=-HH-1.07;pierre.receiveShadow=true;

var plateau=new THREE.Group();plateau.add(grp,pierre);s.add(plateau);

/* Lumières */
s.add(new THREE.HemisphereLight(0xdfe6ff,0x2a2f3a,0.5));
var sol=new THREE.DirectionalLight(0xffffff,1.6);sol.position.set(3,6,4);sol.castShadow=true;
sol.shadow.mapSize.set(1024,1024);var sc=sol.shadow.camera;sc.left=-4;sc.right=4;sc.top=4;sc.bottom=-4;sc.near=1;sc.far=20;sol.shadow.bias=-0.0005;
s.add(sol);

/* Rotation au doigt + rotation lente automatique */
var drag=false,px=0,vit=0.004,cible=0.15;
r.domElement.style.touchAction="none";
r.domElement.addEventListener("pointerdown",function(e){drag=true;px=e.clientX});
addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-px;px=e.clientX;plateau.rotation.y+=dx*0.01;vit=dx*0.0006});
addEventListener("pointerup",function(){drag=false});
addEventListener("pointercancel",function(){drag=false});
(function boucle(){requestAnimationFrame(boucle);
  if(!drag){vit+=(0.004-vit)*0.02;plateau.rotation.y+=vit}
  r.render(s,cam)})();
addEventListener("resize",function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script>
<script>
(function(){
var MODELE="claude-sonnet-4-6";
var $=function(id){return document.getElementById(id)};
var etat={image:null,format:"threejs",code:"",occupe:false};

var depot=$("depot"),fichier=$("fichier"),apercu=$("apercu"),depotTexte=$("depotTexte");
var btn=$("generer"),zoneEtat=$("etat"),zoneErreur=$("erreur");
$("copier").disabled=true;$("telecharger").disabled=true;

function erreur(msg){zoneErreur.textContent=msg;zoneErreur.hidden=!msg}
function statut(msg){zoneEtat.innerHTML=msg?'<span class="point"></span>'+msg:"";zoneEtat.hidden=!msg}

function preparer(file){
return new Promise(function(ok,ko){
var lecteur=new FileReader();
lecteur.onerror=function(){ko(new Error("Lecture échouée"))};
lecteur.onload=function(){
var img=new Image();
img.onerror=function(){ko(new Error("Image invalide"))};
img.onload=function(){
var max=1568,e=Math.min(1,max/Math.max(img.width,img.height));
var c=document.createElement("canvas");
c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
var url=c.toDataURL("image/jpeg",0.85);
ok({url:url,base64:url.split(",")[1]});
};
img.src=lecteur.result;
};
lecteur.readAsDataURL(file);
});
}

function charger(file){
erreur("");
if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){erreur("PNG, JPG ou WebP");return}
preparer(file).then(function(r){
etat.image=r.base64;
apercu.src=r.url;apercu.hidden=false;depotTexte.hidden=true;
btn.disabled=false;
}).catch(function(e){erreur(e.message)});
}

fichier.addEventListener("change",function(){charger(fichier.files[0])});
depot.addEventListener("dragover",function(e){e.preventDefault()});
depot.addEventListener("drop",function(e){e.preventDefault();charger(e.dataTransfer.files[0])});

/* Scènes démo : chaque bouton affiche tout de suite une scène 3D du moteur choisi */
var TETE='<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden;background:#0d1530}canvas{width:100%;height:100%;display:block;touch-action:none}</style>';
var DEMO={
threejs:TETE+'<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script></head><body><div style="position:fixed;left:0;right:0;bottom:14px;text-align:center;font:13px system-ui,sans-serif;color:#9aa6c8;pointer-events:none">Glisse pour tourner le bracelet</div><script>\n'+document.getElementById("scene-bracelet").textContent+'<\/script></body></html>',
babylon:TETE+'<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.0/babylon.js"><\/script></head><body><canvas id="c"></canvas><script>\n'
+'var cv=document.getElementById("c");var en=new BABYLON.Engine(cv,true);var sc=new BABYLON.Scene(en);sc.clearColor=new BABYLON.Color4(0.05,0.08,0.19,1);\n'
+'var cam=new BABYLON.ArcRotateCamera("cam",Math.PI/4,Math.PI/3,6,BABYLON.Vector3.Zero(),sc);cam.attachControl(cv,true);\n'

function nettoyer(t){return t.replace(/^\s*```[a-z]*\s*/i,"").replace(/\s*```\s*$/,"").trim()}

function appeler(format,messages){
var cle=$("cle").value.trim();
var entetes={"content-type":"application/json"};
if(cle){entetes["x-api-key"]=cle;entetes["anthropic-version"]="2023-06-01";entetes["anthropic-dangerous-direct-browser-access"]="true"}
return fetch("https://api.anthropic.com/v1/messages",{
method:"POST",headers:entetes,
body:JSON.stringify({model:MODELE,max_tokens:8000,system:SYSTEME[format],messages:messages})
}).then(function(r){return r.json().then(function(d){return {status:r.status,ok:r.ok,data:d}})}).then(function(r){
if(!r.ok)throw new Error(r.data.error?.message||"Erreur génération");
var texte=(r.data.content||[]).map(function(b){return b.type==="text"?b.text:""}).join("");
if(!texte.trim())throw new Error("Réponse vide");
return nettoyer(texte);
});
}

btn.addEventListener("click",function(){
if(!etat.image||etat.occupe)return;
erreur("");etat.occupe=true;btn.disabled=true;statut("Génération 3D…");
var image=etat.image,format=etat.format;
appeler(format,[
{role:"user",content:[
{type:"image",source:{type:"base64",media_type:"image/jpeg",data:image}},
{type:"text",text:"Convertis cette capture 3D en "+format+" complet. Code seul, HTML prêt à déployer."}
]}
]).then(function(code){
etat.code=code;
$("cadre").srcdoc=code;
$("etiquette").textContent="Code "+NOMS[format]+" généré depuis ta capture.";
$("vide").hidden=true;$("resultat").hidden=false;statut("");
$("copier").disabled=false;$("telecharger").disabled=false;
}).catch(function(e){statut("");erreur(e.message);$("copier").disabled=true;$("telecharger").disabled=true}).finally(function(){etat.occupe=false;btn.disabled=!etat.image});
});

$("copier").addEventListener("click",function(){
if(!etat.code){erreur("Génère d'abord le code");return}
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(etat.code).then(function(){
var b=$("copier");b.textContent="✓ Copié";setTimeout(function(){b.textContent="Copier"},1800);
}).catch(function(){var txt=prompt("Copie manuelle:",etat.code)})
}else{
var txt=prompt("Copie manuelle:",etat.code);
}
});

$("telecharger").addEventListener("click",function(){
if(!etat.code){erreur("Génère d'abord le code");return}
var blob=new Blob([etat.code],{type:"text/html"});
var a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="scene-"+etat.format+".html";
document.body.appendChild(a);
a.click();
a.remove();
URL.revokeObjectURL(a.href);
});

/* Thème toggle */
var themeToggle=$("themeToggle");
function updateToggle(){
var clair=document.documentElement.dataset.theme==="clair";
themeToggle.textContent=clair?"🌙":"☀️";
}
themeToggle.addEventListener("click",function(){
var curr=document.documentElement.dataset.theme||"base";
var next=curr==="base"?"clair":"base";
if(next!=="base")document.documentElement.dataset.theme=next;
else delete document.documentElement.dataset.theme;
try{localStorage.setItem("theme",next)}catch(e){}
updateToggle();
});
updateToggle();
})();
